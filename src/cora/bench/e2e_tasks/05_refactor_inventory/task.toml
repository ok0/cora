id = "e2e_refactor_inventory"
title = "Refactor inventory into a package"
difficulty = "hard"           # easy | medium | hard
requirements = "REQUIREMENTS.md"
template = "template"
required_files = ["inventory/__init__.py", "inventory/models.py", "inventory/core.py", "test_inventory.py"]

[limits]
wall_s = 1200
cost_usd = 0.05
max_iterations = 30

[grader]
dir = "grader"
entry = "grade.py"
timeout_s = 60
visibility = "hidden"          # hidden | visible

[reference]
dir = "reference"
delete = ["inventory.py"]
