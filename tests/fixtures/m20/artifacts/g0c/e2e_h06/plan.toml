goal = "Build the room booking project according to REQUIREMENTS.md by implementing timeparse.py, intervals.py, and rooms.py under the booking package."

[[milestones]]
id = "m1"
title = "Implement timeparse.py"
task = "Implement parse_hhmm in booking/timeparse.py adhering to the requirements in REQUIREMENTS.md, ensuring error conditions and '24:00' with end=True are properly handled."
check = "python -c 'from booking.timeparse import parse_hhmm; assert parse_hhmm(\"24:00\", end=True) == 1440'"
conditions = [
  { kind = "file_exists", path = "booking/timeparse.py" },
]

[[milestones]]
id = "m2"
title = "Implement intervals.py"
task = "Implement Interval, overlaps, and merge in booking/intervals.py using half-open ranges and proper touching/overlapping rules."
check = "python -c 'from booking.intervals import Interval, overlaps, merge; assert len(merge([Interval(0, 10), Interval(5, 15)])) == 1'"
conditions = [
  { kind = "file_exists", path = "booking/intervals.py" },
]

[[milestones]]
id = "m3"
title = "Implement rooms.py and Schedule"
task = "Implement the Schedule class and its book and free_slots methods in booking/rooms.py, supporting midnight-wrapping bookings and free slot calculation."
check = "python -c 'from booking.rooms import Schedule; s = Schedule(); assert s.book(\"A\", \"09:00\", \"10:00\")'"
conditions = [
  { kind = "file_exists", path = "booking/rooms.py" },
]

[[milestones]]
id = "m4"
title = "Run pytest"
task = "Run the test suite using pytest to verify correctness of all implemented modules."
check = "python -m pytest -q"
