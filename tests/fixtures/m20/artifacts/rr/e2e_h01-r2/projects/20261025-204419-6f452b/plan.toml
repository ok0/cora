goal = "Build the project described in REQUIREMENTS.md in the current directory"

[[milestones]]
id = "setup"
title = "Set up workspace and verify structure"
task = "Check that the workspace contains the csvreport directory with the required stub files, and that REQUIREMENTS.md is present."
check = "The csvreport directory exists and contains parser.py, stats.py, cli.py, __init__.py, and __main__.py."
conditions = [
  { kind = "file_exists", path = "REQUIREMENTS.md" },
  { kind = "file_exists", path = "csvreport/parser.py" },
  { kind = "file_exists", path = "csvreport/stats.py" },
  { kind = "file_exists", path = "csvreport/cli.py" },
  { kind = "file_exists", path = "csvreport/__init__.py" },
  { kind = "file_exists", path = "csvreport/__main__.py" },
]

[[milestones]]
id = "parser"
title = "Implement parse_csv in csvreport/parser.py"
task = "Replace the stub in csvreport/parser.py with a correct implementation of parse_csv according to REQUIREMENTS.md. Handle quoted fields, escaped quotes, line endings, and raise ValueError for unterminated quotes."
check = "The function passes basic tests: parse_csv('') returns [], parse_csv('a,b\\nc,d') returns [['a','b'],['c','d']], parse_csv('\"a\",\"b\"') returns [['a','b']], and parse_csv('\"a') raises ValueError with line number 1."
conditions = [
  { kind = "command", cmd = "python -c \"import sys; sys.path.insert(0, '.'); from csvreport.parser import parse_csv; print(parse_csv('a,b\\nc,d') == [['a','b'],['c','d']])\"" },
]

[[milestones]]
id = "stats"
title = "Implement column_stats in csvreport/stats.py"
task = "Replace the stub in csvreport/stats.py with a correct implementation of column_stats according to REQUIREMENTS.md. Handle header lookup, numeric conversion, empty strings, and compute count, min, max, mean."
check = "The function passes basic tests: column_stats([['col'],['1'],['3']], 'col') returns {'count':2,'min':1.0,'max':3.0,'mean':2.0}, column_stats([['col']], 'col') returns {'count':0,'min':None,'max':None,'mean':None}, and column_stats([['col'],['x']], 'col') raises ValueError."
conditions = [
  { kind = "command", cmd = "python -c \"import sys; sys.path.insert(0, '.'); from csvreport.stats import column_stats; rows=[['col'],['1'],['3']]; result=column_stats(rows, 'col'); print(result['count']==2 and result['min']==1.0 and result['max']==3.0 and result['mean']==2.0)\"" },
]

[[milestones]]
id = "cli"
title = "Implement main in csvreport/cli.py"
task = "Replace the stub in csvreport/cli.py with a correct implementation of main according to REQUIREMENTS.md. Handle argument validation, file reading, error messages, and output formatting."
check = "The function passes basic tests: main(['test.csv', 'col']) with a non-existent file prints error and returns 2, main([]) prints usage and returns 2."
conditions = [
  { kind = "command", cmd = "python -c \"import sys; sys.path.insert(0, '.'); from csvreport.cli import main; import io, sys; sys.stderr = io.StringIO(); result = main([]); sys.stderr.seek(0); print(result == 2 and 'usage:' in sys.stderr.read())\"" },
]

[[milestones]]
id = "integration"
title = "Integrate modules and update __init__.py"
task = "Update csvreport/__init__.py to export parse_csv, column_stats, and main. Ensure __main__.py calls main with sys.argv[1:]. Verify the modules work together."
check = "The package can be imported and the functions are accessible. The command 'python -m csvreport' runs and shows usage."
conditions = [
  { kind = "command", cmd = "python -c \"import csvreport; print(hasattr(csvreport, 'parse_csv') and hasattr(csvreport, 'column_stats') and hasattr(csvreport, 'main'))\"" },
]

[[milestones]]
id = "tests"
title = "Run pytest to verify partial test suite"
task = "Run 'python -m pytest -q' to ensure the partial test suite passes. This is a necessary condition."
check = "The pytest command runs without errors and all tests pass."
conditions = [
  { kind = "command", cmd = "python -m pytest -q --tb=no" },
]

[[milestones]]
id = "final"
title = "Create a test file and run the full command"
task = "Create a test CSV file and run the full command 'python -m csvreport test.csv col' to verify end-to-end functionality."
check = "The command runs successfully and prints correct statistics."
conditions = [
  { kind = "command", cmd = "echo 'col\\n1\\n2\\n3' > test.csv && python -m csvreport test.csv col 2>&1 | grep -q 'count=3 min=1.0 max=3.0 mean=2.0' && rm test.csv" },
]
