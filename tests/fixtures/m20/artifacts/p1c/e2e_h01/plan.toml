goal = "Build the CSV column report package with parser, stats, and CLI modules"

[[milestones]]
id = "m1"
title = "Implement CSV parser"
task = "Implement parse_csv in csvreport/parser.py according to specification, handling quoted fields, escapes, and error cases."
check = "python -m pytest -q -k parse_csv"
conditions = [
  { kind = "file_exists", path = "csvreport/parser.py" },
]

[[milestones]]
id = "m2"
title = "Implement column statistics"
task = "Implement column_stats in csvreport/stats.py according to specification, handling numeric conversion, empty values, and error cases."
check = "python -m pytest -q -k column_stats"
conditions = [
  { kind = "file_exists", path = "csvreport/stats.py" },
]

[[milestones]]
id = "m3"
title = "Implement CLI main function"
task = "Implement main in csvreport/cli.py according to specification, handling argument parsing, file reading, and output formatting."
conditions = [
  { kind = "file_exists", path = "csvreport/cli.py" },
]

[[milestones]]
id = "m4"
title = "Set up package exports"
task = "Update csvreport/__init__.py to export parse_csv, column_stats, and main from their respective modules."
conditions = [
  { kind = "file_exists", path = "csvreport/__init__.py" },
]

[[milestones]]
id = "m5"
title = "Run partial test suite"
task = "Run the partial test suite to verify all implemented functionality works together."
check = "python -m pytest -q"
