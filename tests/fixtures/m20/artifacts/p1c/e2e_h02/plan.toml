goal = "Build the ledger project described in REQUIREMENTS.md with files ledger/book.py, ledger/report.py, ledger/importer.py, and tests/test_ledger.py"

[[milestones]]
id = "m1"
title = "Implement Book.balance and Book.balances"
task = "Complete the balance(account) and balances() methods in ledger/book.py according to the specification."
check = "python -c \"import sys; sys.path.insert(0, '.'); from ledger.book import Book; from ledger.models import Entry; b = Book(); b.add(Entry('2024-01-01', 'cash', 1000, 'test')); b.add(Entry('2024-01-02', 'cash', -200, 'test')); b.add(Entry('2024-01-03', 'bank', 500, 'test')); assert b.balance('cash') == 800; assert b.balance('bank') == 500; assert b.balance('nonexistent') == 0; assert b.balances() == {'bank': 500, 'cash': 800}; print('OK')\""
conditions = [
  { kind = "file_exists", path = "ledger/book.py" },
]

[[milestones]]
id = "m2"
title = "Implement format_cents"
task = "Complete format_cents(n: int) -> str in ledger/report.py to format cents as currency with thousands separators and two decimals."
check = "python -c \"import sys; sys.path.insert(0, '.'); from ledger.report import format_cents; assert format_cents(-1230) == '-12.30'; assert format_cents(5) == '0.05'; assert format_cents(123456) == '1,234.56'; assert format_cents(0) == '0.00'; assert format_cents(123456789) == '1,234,567.89'; print('OK')\""
conditions = [
  { kind = "file_exists", path = "ledger/report.py" },
]

[[milestones]]
id = "m3"
title = "Implement monthly_summary"
task = "Complete monthly_summary(book, account) -> list[tuple[str, int]] in ledger/report.py to return monthly totals for an account."
check = "python -c \"import sys; sys.path.insert(0, '.'); from ledger.report import monthly_summary; from ledger.book import Book; from ledger.models import Entry; b = Book(); b.add(Entry('2024-01-15', 'cash', 1000, 'test')); b.add(Entry('2024-01-20', 'cash', -200, 'test')); b.add(Entry('2024-02-10', 'cash', 500, 'test')); b.add(Entry('2024-02-15', 'bank', 300, 'test')); result = monthly_summary(b, 'cash'); expected = [('2024-01', 800), ('2024-02', 500)]; assert result == expected; assert monthly_summary(b, 'bank') == [('2024-02', 300)]; assert monthly_summary(b, 'nonexistent') == []; print('OK')\""
conditions = [
  { kind = "file_exists", path = "ledger/report.py" },
]

[[milestones]]
id = "m4"
title = "Implement load_lines"
task = "Complete load_lines(lines: list[str]) -> Book in ledger/importer.py to parse lines into a Book, handling comments, empty lines, and validation."
check = "python -c \"import sys; sys.path.insert(0, '.'); from ledger.importer import load_lines; lines = ['2024-01-01;cash;10.00;memo', '# comment', '', '2024-01-02;cash;-5.00;']; book = load_lines(lines); assert book.balance('cash') == 500; try: load_lines(['2024-01-01;cash;bad;memo']) except ValueError as e: assert 'bad amount' in str(e); try: load_lines(['2024-01-01;cash;10.00']) except ValueError as e: assert 'expected 4 fields' in str(e); print('OK')\""
conditions = [
  { kind = "file_exists", path = "ledger/importer.py" },
]

[[milestones]]
id = "m5"
title = "Run partial test suite"
task = "Run the partial test suite with python -m pytest -q to verify the implementation meets basic requirements."
check = "python -m pytest -q"
conditions = [
  { kind = "file_exists", path = "tests/test_ledger.py" },
]

[[milestones]]
id = "m6"
title = "Ensure all required files exist"
task = "Verify that all required files (ledger/book.py, ledger/report.py, ledger/importer.py, tests/test_ledger.py) are present and unmodified as specified."
check = "ls ledger/book.py ledger/report.py ledger/importer.py tests/test_ledger.py 2>/dev/null | wc -l | grep -q 4"
