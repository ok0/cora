goal = "Build the project described in REQUIREMENTS.md in the current directory"

[[milestones]]
id = "m1"
title = "Implement Book.balance and Book.balances"
task = "Implement the balance(account) and balances() methods in ledger/book.py according to the requirements. The balance method should return the sum of amount_cents for entries of the given account (0 if none). The balances method should return a dict with sorted keys of accounts that have at least one entry, mapping to their balance."
check = "python -c \"import sys; sys.path.insert(0, '.'); from ledger.book import Book; from ledger.models import Entry; b = Book(); b.add(Entry('2024-01-01', 'cash', 1000, 'test')); b.add(Entry('2024-01-02', 'cash', -500, 'test')); b.add(Entry('2024-01-03', 'bank', 2000, 'test')); assert b.balance('cash') == 500; assert b.balance('bank') == 2000; assert b.balance('nonexistent') == 0; assert b.balances() == {'bank': 2000, 'cash': 500}; print('OK')\""
conditions = [
  { kind = "file_exists", path = "ledger/book.py" },
]

[[milestones]]
id = "m2"
title = "Implement format_cents and monthly_summary"
task = "Implement format_cents(n) and monthly_summary(book, account) in ledger/report.py. format_cents should format an integer cents amount as a string with minus sign for negatives, thousands separators, and exactly two decimals. monthly_summary should return a sorted list of (month, total) tuples for months where the account has entries."
check = "python -c \"import sys; sys.path.insert(0, '.'); from ledger.report import format_cents, monthly_summary; from ledger.book import Book; from ledger.models import Entry; assert format_cents(-1230) == '-12.30'; assert format_cents(5) == '0.05'; assert format_cents(123456) == '1,234.56'; assert format_cents(0) == '0.00'; b = Book(); b.add(Entry('2024-01-15', 'cash', 1000, 'test')); b.add(Entry('2024-01-20', 'cash', -500, 'test')); b.add(Entry('2024-02-10', 'cash', 2000, 'test')); assert monthly_summary(b, 'cash') == [('2024-01', 500), ('2024-02', 2000)]; print('OK')\""
conditions = [
  { kind = "file_exists", path = "ledger/report.py" },
]

[[milestones]]
id = "m3"
title = "Implement load_lines"
task = "Implement load_lines(lines) in ledger/importer.py. It should parse lines, skip empty/comments, validate format (4 fields), parse amounts with parse_amount, and add entries to a Book in input order. Raise ValueError for malformed lines with line numbers."
check = "python -c \"import sys; sys.path.insert(0, '.'); from ledger.importer import load_lines; from ledger.book import Book; lines = ['2024-01-01;cash;10.00;memo', '2024-01-02;bank;-5.00;', '# comment', '', '2024-01-03;cash;20.00;test']; book = load_lines(lines); assert isinstance(book, Book); assert book.balance('cash') == 3000; assert book.balance('bank') == -500; try: load_lines(['2024-01-01;cash;10.00']); except ValueError as e: assert 'expected 4 fields' in str(e); print('OK')\""
conditions = [
  { kind = "file_exists", path = "ledger/importer.py" },
]

[[milestones]]
id = "m4"
title = "Run partial test suite"
task = "Run the partial test suite with python -m pytest -q to verify the implementations meet the basic requirements."
check = "python -m pytest -q"
conditions = [
  { kind = "file_exists", path = "tests/test_ledger.py" },
]
