# Model catalog. Change models/tiers/prices here only. API keys come from env vars.
# Prices are USD per 1M tokens (approximate; verify on openrouter.ai/models).

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_s = 300
request_deadline_s = 300       # total time per HTTP attempt incl. body (keep-alive bytes do not extend it); retried like a network error
stream_stall_timeout_s = 30    # streaming: stop an attempt when no data chunk arrives for this long; same retries
# provider_sort = "throughput" # optional OpenRouter provider routing: "throughput" | "latency" | "price" (unset = OpenRouter default)
# require_parameters = true  # optional: route only to endpoints that support every request parameter (e.g. tools for native runs); unset = OpenRouter default

[providers.gemini]
type = "openai_compat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"   # free-tier key from the environment only; never put the key here
rpm_limit = 5                    # conservative default (free tier); raise only with probe evidence of a higher sustained rate without 429
# max_429_retries = 4            # 429 retries (Retry-After honored, else backoff 1,2,4,8 s)

[[models]]   # default cheap model (first cheap entry; evidence in .docs/bench-results.md); price OpenRouter /api/v1/models 2026-10-18
id = "google/gemini-2.5-flash-lite"
provider = "openrouter"
tier = "cheap"
input_usd_per_mtok = 0.10
output_usd_per_mtok = 0.40
context_tokens = 1048576
supports_tools = true

