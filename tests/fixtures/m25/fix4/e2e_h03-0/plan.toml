goal = "Build the project described in REQUIREMENTS.md in the current directory (its full text is below). Required files: escapes/shell.py, escapes/jsonstr.py, escapes/winpath.py, escapes/catalog.py. Work only inside this directory."

[[milestones]]
id = "m1"
title = "Implement shell quoting"
task = "Implement escapes/shell.py according to the REQUIREMENTS.md specification for shell quoting."
check = "python -m pytest -q"

[[milestones]]
id = "m2"
title = "Implement JSON strings encoder and decoder"
task = "Implement escapes/jsonstr.py according to the REQUIREMENTS.md specification for encode and decode without importing json."
check = "python -m pytest -q"

[[milestones]]
id = "m3"
title = "Implement Windows path conversion"
task = "Implement escapes/winpath.py according to the REQUIREMENTS.md specification for to_posix."
check = "python -m pytest -q"

[[milestones]]
id = "m4"
title = "Implement HTML entity unescaping"
task = "Implement unescape_html in escapes/catalog.py according to the REQUIREMENTS.md specification without changing the ENTITIES table."
check = "python -m pytest -q"
