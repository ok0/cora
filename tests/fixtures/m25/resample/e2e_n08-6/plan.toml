goal = "Build the contacts package implementing email/phone normalization, deduplication, and CLI interface per REQUIREMENTS.md"

[[milestones]]
id = "m1"
title = "Create normalize module"
task = "Create contacts/__init__.py and contacts/normalize.py implementing normalize_email and normalize_phone according to the specification in REQUIREMENTS.md."
conditions = [
  { kind = "file_exists", path = "contacts/normalize.py" },
]

[[milestones]]
id = "m2"
title = "Create merge module"
task = "Create contacts/merge.py implementing dedupe(rows) according to the specification in REQUIREMENTS.md."
conditions = [
  { kind = "file_exists", path = "contacts/merge.py" },
]

[[milestones]]
id = "m3"
title = "Create CLI module and verify requirements"
task = "Create contacts/cli.py implementing main(argv=None) and CLI behavior according to the specification in REQUIREMENTS.md."
conditions = [
  { kind = "file_exists", path = "contacts/cli.py" },
]
