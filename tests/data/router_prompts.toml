[[prompts]]
id = "multi_edit_delay_cap"
source = "multi"
label = "complex"
prompt = "Add a cap on retry delays in the svc package: add \"max_delay_ms\": 500 to DEFAULTS in svc/config.py; change delays in svc/backoff.py to delays(retries, max_ms) so every delay is at most max_ms; make Client.schedule() in svc/client.py pass config.get(\"max_delay_ms\"). Behaviour must otherwise stay the same."

