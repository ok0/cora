[[prompts]]
id = "written_auth_ko"
source = "written"
label = "complex"
prompt = "사용자 인증 기능을 구현해줘. 1. auth/models.py에 User 클래스를 추가하고 비밀번호 해시를 저장한다.\n2. auth/service.py에 login, logout, register 함수를 구현한다.\n3. api/routes.py에 /login, /logout, /register 엔드포인트를 연결하고, 그리고 각 함수에 대한 테스트를 tests/test_auth.py에 작성한다. 세션 저장 방식(메모리 또는 파일)은 설정으로 고를 수 있게 하고, 기존 api/routes.py의 다른 엔드포인트 동작은 바뀌면 안 된다. 실패한 로그인은 횟수를 세어 5회가 넘으면 잠시 막는다. 에러 메시지는 영어로 통일한다. 변경 후 전체 테스트가 통과해야 한다."
