# Router labelled prompt set (M12, charter R34a). Labels may be relabelled by the user (A14).
# Label rule:
#   simple   = question or explanation, no code change
#   ordinary = code change confined to at most 2 files or one well-specified function/feature
#   complex  = change across 3 or more files with several dependent steps or design choices
# source: live = cora.bench.live_tasks.LIVE_TASKS, multi = MULTI_TASKS, e2e = cora.bench.e2e.agent_prompt(task)
#         (prompts copied verbatim; a test checks they match the code), written = written for this set

