[[prompts]]
id = "multi_edit_region"
source = "multi"
label = "complex"
prompt = "Add region support to the svc package: (1) Client(timeout_s=None, region=None): when region is None use config.get(\"region\"), read when the Client is created; (2) add Client.endpoint() returning \"https://<region>.svc.example/v1\"; (3) change svc/cli.py so main(argv=None) accepts an optional \"--region <name>\" argument (argv defaults to sys.argv[1:]) and prints only the endpoint of a Client built with that region. Keep timeouts and schedule() unchanged."

